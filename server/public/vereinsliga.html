<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script src="/local.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Vereinsliga – Dart Live</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #071d47; color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
button, input, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; border: 0; color: inherit; background: none; }
#top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #0b2d6b; border-bottom: 2px solid #fff; }
#top b { font-size: 19px; letter-spacing: 1px; text-transform: uppercase; } #top a { color: #b7d3ff; font-size: 14px; }
#main { max-width: 1000px; margin: 0 auto; padding: 14px 12px 60px; }
h2 { font-size: 20px; margin: 6px 0 10px; } h3 { font-size: 14px; color: #b7d3ff; text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 8px; }
.card { background: #0b2d6b; border: 1px solid #3f6fbf; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; overflow-x: auto; }
label.f { display: block; color: #b7d3ff; font-size: 14px; margin: 10px 0 4px; }
input[type=text], textarea { width: 100%; padding: 8px 10px; border-radius: 6px; border: 2px solid #3f6fbf; background: #fff; color: #071d47; } textarea { min-height: 180px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; } .row > * { flex: 1 1 200px; }
.btn { display: inline-block; padding: 10px 16px; border-radius: 7px; background: #fff; color: #071d47; font-weight: bold; margin: 4px 6px 4px 0; }
.btn.sec { background: #10377f; color: #fff; border: 1px solid #3f6fbf; } .btn.warn { background: #6b1d2d; color: #fff; } .btn.sm { padding: 5px 9px; font-size: 13px; }
.seg button { padding: 8px 12px; border-radius: 6px; background: #10377f; border: 1px solid #3f6fbf; margin: 0 6px 6px 0; } .seg button.on { background: #fff; color: #071d47; font-weight: bold; }
.note { color: #b7d3ff; font-size: 14px; margin: 6px 0; }
table { width: 100%; border-collapse: collapse; } td, th { padding: 7px 5px; border-bottom: 1px solid #23498f; text-align: left; } th { color: #b7d3ff; font-weight: normal; font-size: 12px; text-transform: uppercase; } td.n, th.n { text-align: center; }
tr.first td { background: #fff; color: #071d47; font-weight: bold; }
.bar { height: 10px; background: #23498f; border-radius: 5px; overflow: hidden; margin: 6px 0 2px; } .bar div { height: 100%; background: #8cc4ff; }
#dlg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; }
#dlg .box { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 380px; max-width: 94%; background: #fff; color: #071d47; border-radius: 10px; padding: 16px; }
#dlg .lg { display: flex; align-items: center; gap: 8px; margin: 8px 0; } #dlg .lg span { flex: 1 1 auto; font-weight: bold; }
#dlg .lg input { width: 70px; text-align: center; font-size: 22px; padding: 6px; border: 2px solid #3f6fbf; border-radius: 6px; }
#dlg .btn { background: #0b2d6b; color: #fff; } #dlg .btn.sec { background: #e3ebf7; color: #071d47; border: 0; }
#toast { display: none; position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #fff; color: #071d47; font-weight: bold; padding: 10px 18px; border-radius: 8px; z-index: 30; } #toast.bad { background: #ffd6d6; color: #6b1d2d; }
@media (max-width: 600px) { td, th { padding: 5px 3px; font-size: 14px; } }
</style>
</head>
<body>
<div id="top"><b>Vereinsliga</b><a href="/">Start</a></div>
<div id="main">Lade …</div>
<div id="dlg"><div class="box" id="dlgbox"></div></div>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  var D = null, names = [], version = 0, filter = '';
  var form = { name: 'Vereinsliga ' + new Date().getFullYear(), players: '', legs: 3, twice: false };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  var tt; function toast(t, bad) { var el = $('toast'); el.innerHTML = esc(t); el.className = bad ? 'bad' : ''; el.style.display = 'block'; clearTimeout(tt); tt = setTimeout(function () { el.style.display = 'none'; }, 3500); }
  function req(method, url, body, cb) {
    var r = new XMLHttpRequest(); r.open(method, url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now(), true);
    r.onreadystatechange = function () { if (r.readyState !== 4) return; var d = null; try { d = JSON.parse(r.responseText); } catch (e) {} cb(r.status >= 200 && r.status < 300 ? null : ((d && d.error) || 'Keine Verbindung zum Server'), d); };
    if (body) { r.setRequestHeader('Content-Type', 'application/json'); r.send(JSON.stringify(body)); } else r.send();
  }
  function act(body, okMsg, cb) { req('POST', '/api/x/vliga', body, function (e, d) { if (e) return toast(e, true); if (okMsg) toast(okMsg); load(); if (cb) cb(d); }); }
  function load() { req('GET', '/api/x/vliga', null, function (e, d) { if (!e && d) { D = d; var a = document.activeElement; if ($('dlg').style.display !== 'block' && !(a && /INPUT|TEXTAREA/.test(a.tagName))) render(); } }); }
  function wait() { req('GET', '/api/wait?v=' + version, null, function (e, d) { if (d) { names = d.names || []; if (d.v !== version) { version = d.v; load(); } setTimeout(wait, 100); } else setTimeout(wait, 3000); }); }
  function plist() { return form.players.split(/\n|,/).map(function (s) { return s.replace(/^\s+|\s+$/g, ''); }).filter(Boolean); }
  function seg(key, vals, cur, labels) { var h = '<div class="seg">'; vals.forEach(function (v, i) { h += '<button data-f="' + key + '" data-v="' + v + '"' + (String(cur) === String(v) ? ' class="on"' : '') + '>' + (labels ? labels[i] : v) + '</button>'; }); return h + '</div>'; }

  function table() {
    var S = {};
    D.season.players.forEach(function (p) { S[p] = { name: p, sp: 0, s: 0, n: 0, lf: 0, la: 0, pts: 0, open: 0 }; });
    D.games.forEach(function (g) {
      var a = S[g.p1], b = S[g.p2]; if (!a || !b) return;
      if (g.status !== 'done') { a.open++; b.open++; return; }
      a.sp++; b.sp++; a.lf += g.legs[0]; a.la += g.legs[1]; b.lf += g.legs[1]; b.la += g.legs[0];
      if (g.winner === g.p1) { a.s++; b.n++; a.pts += 2; } else { b.s++; a.n++; b.pts += 2; }
    });
    var arr = Object.keys(S).map(function (k) { return S[k]; });
    arr.sort(function (x, y) { return (y.pts - x.pts) || ((y.lf - y.la) - (x.lf - x.la)) || (y.lf - x.lf) || x.name.localeCompare(y.name); });
    return arr;
  }

  function render() {
    if (!D) return;
    if (!D.season) { $('main').innerHTML = createHTML(); return; }
    var done = D.games.filter(function (g) { return g.status === 'done'; }).length, total = D.games.length;
    var h = '<h2>' + esc(D.season.name) + '</h2><p class="note">' + D.season.players.length + ' Spieler · ' + (D.season.twice ? 'Hin- und Rückrunde' : 'jeder einmal gegen jeden') + ' · First to ' + D.season.legs + ' · ' + done + ' von ' + total + ' Spielen gespielt</p>' +
      '<div class="bar"><div style="width:' + Math.round(done / total * 100) + '%"></div></div>';
    h += '<h3>Tabelle</h3><div class="card"><table><tr><th>#</th><th>Spieler</th><th class="n">Sp</th><th class="n">S</th><th class="n">N</th><th class="n">Legs</th><th class="n">Pkt</th><th class="n">offen</th></tr>';
    table().forEach(function (r, i) { h += '<tr' + (i === 0 && r.sp ? ' class="first"' : '') + '><td>' + (i + 1) + '.</td><td>' + esc(r.name) + '</td><td class="n">' + r.sp + '</td><td class="n">' + r.s + '</td><td class="n">' + r.n + '</td><td class="n">' + r.lf + ':' + r.la + '</td><td class="n"><b>' + r.pts + '</b></td><td class="n">' + r.open + '</td></tr>'; });
    h += '</table></div><p class="note">Gespielt wird ganz normal an einem Tablet: „Vereinsliga-Spiel“ antippen und die Paarung wählen – das Ergebnis landet automatisch hier.</p>';
    h += '<h3>Spiele</h3><div class="row"><div><input type="text" id="flt" placeholder="Spieler suchen …" value="' + esc(filter) + '"></div></div><div class="card"><table>';
    var list = D.games.filter(function (g) { return !filter || (g.p1 + ' ' + g.p2).toLowerCase().indexOf(filter.toLowerCase()) >= 0; });
    list.sort(function (a, b) { var o = { running: 0, open: 1, done: 2 }; return o[a.status] - o[b.status]; });
    list.forEach(function (g) {
      h += '<tr><td>' + (g.winner === g.p1 ? '<b>' + esc(g.p1) + '</b>' : esc(g.p1)) + ' – ' + (g.winner === g.p2 ? '<b>' + esc(g.p2) + '</b>' : esc(g.p2)) + '</td><td class="n"><b>' + (g.legs ? g.legs[0] + ':' + g.legs[1] : '') + '</b></td>' +
        '<td class="note">' + (g.status === 'running' ? 'läuft auf Scheibe ' + g.board : g.status === 'done' ? new Date(g.date).toLocaleDateString('de-DE') : 'offen') + '</td>' +
        '<td style="text-align:right;white-space:nowrap"><button class="btn sec sm" data-res="' + g.id + '">Ergebnis</button>' + (g.status !== 'open' ? '<button class="btn warn sm" data-reset="' + g.id + '">Zurücksetzen</button>' : '') + '</td></tr>';
    });
    h += '</table></div><button class="btn warn" data-a="delete">Vereinsliga beenden &amp; löschen</button>';
    $('main').innerHTML = h;
  }
  function createHTML() {
    var n = plist().length, games = n * (n - 1) / 2 * (form.twice ? 2 : 1);
    var h = '<h2>Vereinsliga anlegen</h2><div class="card"><p class="note">Jeder spielt über die Saison gegen jeden – wann es passt, an jedem Tablet. Die Tabelle rechnet sich von selbst (Sieg = 2 Punkte, dann Leg-Differenz).</p>' +
      '<label class="f">Name</label><input type="text" data-in="name" value="' + esc(form.name) + '">' +
      '<label class="f">Spieler – einer pro Zeile (' + n + (n > 1 ? ' → ' + games + ' Spiele' : '') + ')</label><textarea data-in="players">' + esc(form.players) + '</textarea>';
    var known = names.filter(function (x) { return plist().indexOf(x) < 0; });
    if (known.length) { h += '<div class="seg" style="margin-top:6px">'; known.forEach(function (k) { h += '<button data-add="' + esc(k) + '">' + esc(k) + '</button>'; }); h += '</div>'; }
    h += '<div class="row"><div><label class="f">First to</label>' + seg('legs', [2, 3, 4], form.legs) + '</div><div><label class="f">Modus</label>' + seg('twice', ['false', 'true'], String(form.twice), ['Einfach', 'Hin- und Rückrunde']) + '</div></div>' +
      '<button class="btn" data-a="create">Vereinsliga starten</button></div>';
    return h;
  }
  var fns = [];
  function dialog(html, btns) { fns = btns; var h = html; btns.forEach(function (b, i) { h += '<button class="btn' + (b.sec ? ' sec' : '') + '" data-dlg="' + i + '">' + esc(b.label) + '</button>'; }); $('dlgbox').innerHTML = h; $('dlg').style.display = 'block'; }
  function closeDlg() { $('dlg').style.display = 'none'; render(); }
  function find(id) { return D.games.filter(function (g) { return g.id === id; })[0]; }
  document.addEventListener('click', function (e) {
    var t = e.target; while (t && t !== document.body && !(t.hasAttribute && (t.hasAttribute('data-a') || t.hasAttribute('data-f') || t.hasAttribute('data-add') || t.hasAttribute('data-res') || t.hasAttribute('data-reset') || t.hasAttribute('data-dlg')))) t = t.parentNode;
    if (!t || t === document.body) return;
    if (t.hasAttribute('data-dlg')) { var b = fns[+t.getAttribute('data-dlg')]; if (!(b && b.keep)) closeDlg(); if (b && b.fn) b.fn(); return; }
    if (t.hasAttribute('data-f')) { var v = t.getAttribute('data-v'); form[t.getAttribute('data-f')] = v === 'true' ? true : v === 'false' ? false : +v; return render(); }
    if (t.hasAttribute('data-add')) { form.players = form.players.replace(/\s+$/, '') + (plist().length ? '\n' : '') + t.getAttribute('data-add'); return render(); }
    if (t.hasAttribute('data-res')) {
      var g = find(t.getAttribute('data-res')), l = g.legs || [0, 0];
      return dialog('<h4>' + esc(g.p1) + ' – ' + esc(g.p2) + '</h4><div class="lg"><span>' + esc(g.p1) + '</span><input id="l1" inputmode="numeric" value="' + l[0] + '"></div><div class="lg"><span>' + esc(g.p2) + '</span><input id="l2" inputmode="numeric" value="' + l[1] + '"></div>',
        [{ label: 'Speichern', keep: true, fn: function () { act({ action: 'result', id: g.id, legs: [parseInt($('l1').value, 10) || 0, parseInt($('l2').value, 10) || 0] }, 'Gespeichert', closeDlg); } }, { label: 'Abbrechen', sec: true }]);
    }
    if (t.hasAttribute('data-reset')) { var id = t.getAttribute('data-reset'); return dialog('<h4>Spiel zurücksetzen?</h4><p>Es wird wieder als offen geführt.</p>', [{ label: 'Ja', fn: function () { act({ action: 'reset', id: id }, 'Zurückgesetzt'); } }, { label: 'Abbrechen', sec: true }]); }
    var a = t.getAttribute('data-a');
    if (a === 'create') act({ action: 'create', name: form.name, players: plist(), legs: form.legs, twice: form.twice }, 'Vereinsliga gestartet');
    else if (a === 'delete') dialog('<h4>Vereinsliga löschen?</h4><p>Tabelle und Spielplan gehen verloren (die Spiele bleiben in der Statistik).</p>', [{ label: 'Ja, löschen', fn: function () { act({ action: 'delete' }, 'Gelöscht'); } }, { label: 'Abbrechen', sec: true }]);
  }, false);
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-in'); if (k) form[k] = e.target.value;
    if (e.target.id === 'flt') { filter = e.target.value; var pos = e.target.selectionStart; render(); var f = $('flt'); if (f) { f.focus(); f.setSelectionRange(pos, pos); } }
  }, false);
  document.addEventListener('focusout', function (e) { if (e.target.getAttribute('data-in') === 'players') setTimeout(render, 150); }, false);
  load(); wait();
})();
</script>
</body>
</html>
