<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script src="/local.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Blind-Doppel – Dart Live</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #071d47; color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
button, input, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; border: 0; color: inherit; background: none; }
#top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #0b2d6b; border-bottom: 2px solid #fff; }
#top b { font-size: 19px; letter-spacing: 1px; text-transform: uppercase; } #net { font-size: 13px; color: #b7d3ff; } #net.bad { color: #ffb3b3; }
#main { max-width: 1000px; margin: 0 auto; padding: 14px 12px 60px; }
h2 { font-size: 20px; margin: 6px 0 10px; } h3 { font-size: 14px; color: #b7d3ff; text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 8px; }
.card { background: #0b2d6b; border: 1px solid #3f6fbf; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; overflow-x: auto; }
label.f { display: block; color: #b7d3ff; font-size: 14px; margin: 10px 0 4px; }
input[type=text], textarea { width: 100%; padding: 8px 10px; border-radius: 6px; border: 2px solid #3f6fbf; background: #fff; color: #071d47; }
textarea { min-height: 200px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; } .row > * { flex: 1 1 200px; }
.btn { display: inline-block; padding: 10px 16px; border-radius: 7px; background: #fff; color: #071d47; font-weight: bold; margin: 4px 6px 4px 0; }
.btn.sec { background: #10377f; color: #fff; border: 1px solid #3f6fbf; } .btn.warn { background: #6b1d2d; color: #fff; } .btn.sm { padding: 6px 10px; font-size: 13px; }
.seg button { padding: 8px 12px; border-radius: 6px; background: #10377f; border: 1px solid #3f6fbf; margin: 0 6px 6px 0; } .seg button.on { background: #fff; color: #071d47; font-weight: bold; }
.note { color: #b7d3ff; font-size: 14px; margin: 6px 0; }
table { width: 100%; border-collapse: collapse; } td, th { padding: 7px 5px; border-bottom: 1px solid #23498f; text-align: left; } th { color: #b7d3ff; font-weight: normal; font-size: 12px; text-transform: uppercase; } td.n, th.n { text-align: center; }
tr.first td { background: #fff; color: #071d47; font-weight: bold; }
.st { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; white-space: nowrap; }
.st.pending { background: #23498f; } .st.assigned { background: #c9a227; color: #071d47; } .st.running { background: #2e9d5b; } .st.done { background: #fff; color: #071d47; }
.champ { text-align: center; padding: 18px; font-size: 24px; font-weight: bold; background: #fff; color: #071d47; border-radius: 10px; margin-bottom: 12px; }
#dlg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; }
#dlg .box { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 380px; max-width: 94%; background: #fff; color: #071d47; border-radius: 10px; padding: 16px; }
#dlg .lg { display: flex; align-items: center; gap: 8px; margin: 8px 0; } #dlg .lg span { flex: 1 1 auto; font-weight: bold; }
#dlg .lg input { width: 70px; text-align: center; font-size: 22px; padding: 6px; border: 2px solid #3f6fbf; border-radius: 6px; }
#dlg .btn { background: #0b2d6b; color: #fff; } #dlg .btn.sec { background: #e3ebf7; color: #071d47; border: 0; }
#toast { display: none; position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #fff; color: #071d47; font-weight: bold; padding: 10px 18px; border-radius: 8px; z-index: 30; }
#toast.bad { background: #ffd6d6; color: #6b1d2d; }
@media (max-width: 600px) { td, th { padding: 5px 3px; font-size: 14px; } }
</style>
</head>
<body>
<div id="top"><b>Blind-Doppel</b><span id="net">verbinde …</span></div>
<div id="main">Lade …</div>
<div id="dlg"><div class="box" id="dlgbox"></div></div>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  var S = null, version = 0;
  var form = { name: 'Blind-Doppel ' + new Date().toLocaleDateString('de-DE'), players: '', rounds: 4, legs: 2, start: 501 };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  var tt; function toast(t, bad) { var el = $('toast'); el.innerHTML = esc(t); el.className = bad ? 'bad' : ''; el.style.display = 'block'; clearTimeout(tt); tt = setTimeout(function () { el.style.display = 'none'; }, 3500); }
  function req(method, url, body, cb) {
    var r = new XMLHttpRequest(); r.open(method, url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now(), true);
    r.onreadystatechange = function () { if (r.readyState !== 4) return; var d = null; try { d = JSON.parse(r.responseText); } catch (e) {} cb(r.status >= 200 && r.status < 300 ? null : ((d && d.error) || 'Keine Verbindung zum Server'), d); };
    if (body) { r.setRequestHeader('Content-Type', 'application/json'); r.send(JSON.stringify(body)); } else r.send();
  }
  function act(body, okMsg, cb) { req('POST', '/api/turnier', body, function (e, d) { if (e) return toast(e, true); if (okMsg) toast(okMsg); if (cb) cb(d); }); }
  function poll() {
    req('GET', '/api/wait?v=' + version, null, function (e, d) {
      if (e || !d) { $('net').className = 'bad'; $('net').innerHTML = '⚠ Server nicht erreichbar'; return setTimeout(poll, 2500); }
      $('net').className = ''; $('net').innerHTML = '● verbunden';
      var ch = d.v !== version; version = d.v; S = d;
      var a = document.activeElement;
      if (ch && $('dlg').style.display !== 'block' && !(a && /INPUT|TEXTAREA/.test(a.tagName))) render();
      setTimeout(poll, 50);
    });
  }
  function plist() { return form.players.split(/\n|,/).map(function (s) { return s.replace(/^\s+|\s+$/g, ''); }).filter(Boolean); }
  function seg(key, vals, cur) { var h = '<div class="seg">'; vals.forEach(function (v) { h += '<button data-f="' + key + '" data-v="' + v + '"' + (String(cur) === String(v) ? ' class="on"' : '') + '>' + v + '</button>'; }); return h + '</div>'; }

  function render() {
    var T = S && S.tournament;
    if (T && T.type !== 'blind') { $('main').innerHTML = '<div class="card">Gerade läuft schon ein Turnier oder Liga-Spieltag („' + esc(T.name) + '“). Erst dort löschen, dann kann ein Blind-Doppel starten.</div>'; return; }
    $('main').innerHTML = T ? runHTML(T) : createHTML();
  }
  function createHTML() {
    var n = plist().length, names = (S && S.names) || [];
    var h = '<h2>Blind-Doppel anlegen</h2><div class="card"><p class="note">Jede Runde lost die App neue Doppel-Partner zu (möglichst niemand zweimal mit demselben Partner). Gewertet wird jeder Spieler einzeln: Siegquote, dann Punkte, dann Legs.</p>' +
      '<label class="f">Name</label><input type="text" data-in="name" value="' + esc(form.name) + '">' +
      '<label class="f">Spieler – einer pro Zeile (' + n + (n % 4 ? ' – pro Runde setzen ' + (n % 4) + ' aus' : '') + ')</label><textarea data-in="players">' + esc(form.players) + '</textarea>';
    var known = names.filter(function (x) { return plist().indexOf(x) < 0; });
    if (known.length) { h += '<p class="note">Antippen zum Hinzufügen:</p><div class="seg">'; known.forEach(function (k) { h += '<button data-add="' + esc(k) + '">' + esc(k) + '</button>'; }); h += '</div>'; }
    h += '<div class="row"><div><label class="f">Runden</label>' + seg('rounds', [3, 4, 5, 6, 8], form.rounds) + '</div><div><label class="f">First to</label>' + seg('legs', [1, 2, 3], form.legs) + '</div><div><label class="f">Punkte</label>' + seg('start', [301, 501], form.start) + '</div></div>' +
      '<button class="btn" data-a="create">Erste Runde auslosen</button><button class="btn sec" data-a="demo">8 Testspieler</button></div>';
    return h;
  }
  function stText(m) { return { pending: 'offen', assigned: 'Scheibe ' + m.board + ' – bereit', running: 'läuft auf ' + m.board, done: 'beendet' }[m.status]; }
  function runHTML(T) {
    var h = T.status === 'done' ? '<div class="champ">🏆 ' + esc(T.champion) + '</div>' : '';
    h += '<h2>' + esc(T.name) + ' <span class="note">· Runde ' + T.round + ' von ' + T.cfg.rounds + '</span></h2>';
    if (T.sitting && T.sitting.length && T.status !== 'done') h += '<p class="note">Pause in dieser Runde: ' + T.sitting.map(esc).join(', ') + '</p>';
    for (var r = T.round; r >= 1; r--) {
      var list = T.matches.filter(function (m) { return m.round === r; });
      h += '<h3>Runde ' + r + '</h3><div class="card"><table>';
      list.forEach(function (m) {
        h += '<tr><td>' + (m.winner === m.p1 ? '<b>' + esc(m.p1) + '</b>' : esc(m.p1)) + '</td><td class="n"><b>' + (m.legs ? m.legs[0] + ' : ' + m.legs[1] : 'gegen') + '</b></td><td>' + (m.winner === m.p2 ? '<b>' + esc(m.p2) + '</b>' : esc(m.p2)) + '</td>' +
          '<td><span class="st ' + m.status + '">' + stText(m) + '</span></td><td style="text-align:right;white-space:nowrap"><button class="btn sec sm" data-res="' + m.id + '">Ergebnis</button>' +
          (m.status === 'done' || m.status === 'running' ? '<button class="btn warn sm" data-reset="' + m.id + '">Zurücksetzen</button>' : '') + '</td></tr>';
      });
      h += '</table></div>';
      if (r === T.round && T.round > 1) h += '<details><summary class="note" style="cursor:pointer">Frühere Runden anzeigen</summary>';
    }
    if (T.round > 1) h += '</details>';
    var tab = S.blindTable || [];
    h += '<h3>Wertung</h3><div class="card"><table><tr><th>#</th><th>Spieler</th><th class="n">Sp</th><th class="n">S</th><th class="n">Quote</th><th class="n">Legs</th><th class="n">Pause</th></tr>';
    tab.forEach(function (s, i) { h += '<tr' + (i === 0 ? ' class="first"' : '') + '><td>' + s.rank + '.</td><td>' + esc(s.name) + '</td><td class="n">' + s.played + '</td><td class="n">' + s.won + '</td><td class="n">' + Math.round(s.quote * 100) + ' %</td><td class="n">' + s.lf + ':' + s.la + '</td><td class="n">' + s.sat + '</td></tr>'; });
    h += '</table></div><p class="note">Die nächste Runde wird automatisch ausgelost, sobald alle Spiele der Runde beendet sind. Fernseher: <b>' + esc(location.host) + '/turnier-tv</b></p><button class="btn warn" data-a="delete">Blind-Doppel beenden &amp; löschen</button>';
    return h;
  }
  var fns = [];
  function dialog(html, btns) { fns = btns; var h = html; btns.forEach(function (b, i) { h += '<button class="btn' + (b.sec ? ' sec' : '') + '" data-dlg="' + i + '">' + esc(b.label) + '</button>'; }); $('dlgbox').innerHTML = h; $('dlg').style.display = 'block'; }
  function closeDlg() { $('dlg').style.display = 'none'; render(); }
  function find(id) { return S.tournament.matches.filter(function (m) { return m.id === id; })[0]; }
  document.addEventListener('click', function (e) {
    var t = e.target; while (t && t !== document.body && !(t.hasAttribute && (t.hasAttribute('data-a') || t.hasAttribute('data-f') || t.hasAttribute('data-add') || t.hasAttribute('data-res') || t.hasAttribute('data-reset') || t.hasAttribute('data-dlg')))) t = t.parentNode;
    if (!t || t === document.body) return;
    if (t.hasAttribute('data-dlg')) { var b = fns[+t.getAttribute('data-dlg')]; if (!(b && b.keep)) closeDlg(); if (b && b.fn) b.fn(); return; }
    if (t.hasAttribute('data-f')) { form[t.getAttribute('data-f')] = +t.getAttribute('data-v'); return render(); }
    if (t.hasAttribute('data-add')) { form.players = (form.players.replace(/\s+$/, '') + (plist().length ? '\n' : '') + t.getAttribute('data-add')); return render(); }
    if (t.hasAttribute('data-res')) {
      var m = find(t.getAttribute('data-res')), l = m.legs || [0, 0];
      return dialog('<h4>' + esc(m.label) + '</h4><div class="lg"><span>' + esc(m.p1) + '</span><input id="l1" inputmode="numeric" value="' + l[0] + '"></div><div class="lg"><span>' + esc(m.p2) + '</span><input id="l2" inputmode="numeric" value="' + l[1] + '"></div>',
        [{ label: 'Speichern', keep: true, fn: function () { act({ action: 'result', id: m.id, legs: [parseInt($('l1').value, 10) || 0, parseInt($('l2').value, 10) || 0] }, 'Gespeichert', closeDlg); } }, { label: 'Abbrechen', sec: true }]);
    }
    if (t.hasAttribute('data-reset')) { var id = t.getAttribute('data-reset'); return dialog('<h4>Spiel zurücksetzen?</h4>', [{ label: 'Ja', fn: function () { act({ action: 'reset', id: id }, 'Zurückgesetzt'); } }, { label: 'Abbrechen', sec: true }]); }
    var a = t.getAttribute('data-a');
    if (a === 'demo') { form.players = ['Johannes', 'Sepp', 'Max', 'Anna', 'Toni', 'Lisa', 'Franz', 'Vroni'].join('\n'); render(); }
    else if (a === 'create') act({ action: 'blind', name: form.name, players: plist(), rounds: form.rounds, legs: form.legs, start: form.start }, 'Runde 1 ausgelost');
    else if (a === 'delete') dialog('<h4>Blind-Doppel löschen?</h4><p>Die Wertung geht verloren (gespielte Spiele bleiben in der Statistik).</p>', [{ label: 'Ja, löschen', fn: function () { act({ action: 'delete' }, 'Gelöscht'); } }, { label: 'Abbrechen', sec: true }]);
  }, false);
  document.addEventListener('input', function (e) { var k = e.target.getAttribute('data-in'); if (k) form[k] = e.target.value; }, false);
  document.addEventListener('focusout', function (e) { if (e.target.getAttribute('data-in') === 'players') setTimeout(render, 150); }, false);
  poll();
})();
</script>
</body>
</html>
