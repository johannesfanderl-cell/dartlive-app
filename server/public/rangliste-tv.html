<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script src="/local.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vereinsrangliste</title>
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #071d47; }
body { color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 20px; cursor: none; }
#bar { height: 1.8em; line-height: 1.8em; padding: 0 0.8em; background: #0b2d6b; border-bottom: 0.12em solid #fff; font-weight: bold; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
#bar .r { float: right; color: #8cc4ff; }
table.cols { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0.5em; }
table.cols > tbody > tr > td { vertical-align: top; }
table.l { width: 100%; border-collapse: collapse; background: #0b2d6b; }
table.l td { padding: 0.22em 0.5em; border-top: 0.05em solid #23498f; white-space: nowrap; overflow: hidden; }
table.l td.n { width: 2em; text-align: right; color: #b7d3ff; }
table.l td.e { width: 3.2em; text-align: right; font-weight: bold; }
table.l td.c { width: 3.2em; text-align: right; font-size: 0.75em; }
table.l tr.f td { background: #ffffff; color: #071d47; font-weight: bold; }
.up { color: #8cff9e; } .down { color: #ffb3b3; }
.empty { padding: 3em 1em; text-align: center; font-size: 1.5em; color: #b7d3ff; }
</style>
</head>
<body>
<div id="bar"><span class="r">Elo · Saison <span id="yr"></span></span>TV Riedenburg · Vereinsrangliste</div>
<div id="wrap"><div class="empty">Lade …</div></div>
<script>
(function () {
  var all = [], version = 0, year = new Date().getFullYear();
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function render() {
    var w = window.innerWidth || document.documentElement.clientWidth, h = window.innerHeight || document.documentElement.clientHeight;
    document.getElementById('yr').innerHTML = year;
    var ms = [], i;
    for (i = 0; i < all.length; i++) if (!all[i].doubles && new Date(all[i].date).getFullYear() === year) ms.push(all[i]);
    ms.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var P = {}, list = [];
    function pl(n) { var k = n.toLowerCase(); if (!P[k]) { P[k] = { name: n, elo: 1000, last: 0 }; list.push(P[k]); } return P[k]; }
    for (i = 0; i < ms.length; i++) {
      var a = pl(ms[i].players[0].name), b = pl(ms[i].players[1].name);
      var ea = 1 / (1 + Math.pow(10, (b.elo - a.elo) / 400)), d = Math.round(32 * ((ms[i].winner === 0 ? 1 : 0) - ea));
      a.elo += d; b.elo -= d; a.last = d; b.last = -d;
    }
    list.sort(function (x, y) { return y.elo - x.elo; });
    var cols = list.length > 12 ? 2 : 1, rows = Math.ceil(list.length / cols);
    document.body.style.fontSize = Math.max(9, Math.floor(Math.min(w / cols / 14, h / (Math.max(rows, 8) * 1.45 + 3)))) + 'px';
    if (!list.length) { document.getElementById('wrap').innerHTML = '<div class="empty">Noch keine Spiele in ' + year + '</div>'; return; }
    var out = '<table class="cols"><tr>';
    for (var c = 0; c < cols; c++) {
      out += '<td><table class="l">';
      for (var r = c * rows; r < (c + 1) * rows && r < list.length; r++) {
        var p = list[r];
        out += '<tr' + (r === 0 ? ' class="f"' : '') + '><td class="n">' + (r + 1) + '.</td><td>' + esc(p.name) + '</td><td class="e">' + p.elo + '</td><td class="c ' + (p.last > 0 ? 'up' : p.last < 0 ? 'down' : '') + '">' + (p.last > 0 ? '+' + p.last : p.last < 0 ? p.last : '') + '</td></tr>';
      }
      out += '</table></td>';
    }
    document.getElementById('wrap').innerHTML = out + '</tr></table>';
  }
  function get(url, cb) { var r = new XMLHttpRequest(); r.onreadystatechange = function () { if (r.readyState === 4) { var d = null; try { d = JSON.parse(r.responseText); } catch (e) {} cb(d); } }; r.open('GET', url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + new Date().getTime(), true); r.send(); }
  function load() { get('/api/matches', function (d) { if (d) { all = d.matches || []; render(); } }); }
  function wait() { get('/api/wait?v=' + version, function (d) { if (d) { if (d.v !== version) { version = d.v; load(); } setTimeout(wait, 100); } else setTimeout(wait, 3000); }); }
  window.onresize = render;
  load(); wait();
})();
</script>
</body>
</html>
