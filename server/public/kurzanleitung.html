<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script src="/local.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurzanleitung Dart Live</title>
<style>
@page { size: A4; margin: 10mm; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #e9edf3; color: #071d47; font-family: "Roboto", "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
.tools { text-align: center; margin: 12px; } .tools button, .tools select { padding: 9px 14px; font-size: 15px; border-radius: 6px; border: 1px solid #0b2d6b; margin: 0 4px; }
.tools button { background: #0b2d6b; color: #fff; font-weight: bold; border: 0; cursor: pointer; }
.page { width: 190mm; min-height: 277mm; margin: 10px auto; background: #fff; padding: 9mm 10mm; box-shadow: 0 2px 10px rgba(0,0,0,.2); page-break-after: always; display: flex; flex-direction: column; }
.head { display: flex; align-items: center; justify-content: space-between; background: #0b2d6b; color: #fff; border-radius: 4mm; padding: 4mm 6mm; margin-bottom: 5mm; }
.head .t { font-size: 15pt; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; } .head .t small { display: block; font-size: 10pt; font-weight: normal; letter-spacing: 0; text-transform: none; opacity: .85; margin-top: 1mm; }
.head .n { font-size: 30pt; font-weight: bold; text-align: center; line-height: 1; } .head .n small { display: block; font-size: 9pt; font-weight: normal; letter-spacing: 1px; text-transform: uppercase; }
.steps { flex: 1 1 auto; }
.st { display: flex; gap: 4mm; padding: 3mm 0; border-bottom: 0.4mm solid #dfe6f2; }
.st .no { flex: 0 0 11mm; height: 11mm; border-radius: 50%; background: #0b2d6b; color: #fff; font-size: 15pt; font-weight: bold; display: flex; align-items: center; justify-content: center; }
.st h2 { font-size: 13.5pt; margin-bottom: 1mm; } .st p { font-size: 11pt; line-height: 1.38; }
.k { display: inline-block; border: 0.4mm solid #0b2d6b; border-radius: 1.5mm; padding: 0 1.8mm; font-weight: bold; background: #eef3fb; white-space: nowrap; }
.help { margin-top: 4mm; background: #fff4d6; border: 0.5mm solid #c9a227; border-radius: 3mm; padding: 3mm 4mm; font-size: 10.5pt; line-height: 1.4; }
.help b { display: block; font-size: 11.5pt; margin-bottom: 1mm; }
@media print { body { background: #fff; } .tools { display: none; } .page { box-shadow: none; margin: 0; width: auto; min-height: 275mm; } }
</style>
</head>
<body>
<div class="tools">Scheiben: <select id="sel"><option value="all">Alle 5 Seiten</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select> <button onclick="window.print()">Drucken</button></div>
<div id="pages"></div>
<script>
(function () {
  function page(n) {
    return '<div class="page"><div class="head"><div class="t">Dart Live – so geht\'s<small>TV Riedenburg · Eingabe am Tablet, Spielstand auf dem Monitor</small></div><div class="n"><small>Scheibe</small>' + n + '</div></div><div class="steps">' +
      st(1, 'Spiel starten', 'Namen eintippen oder einen der zuletzt benutzten Namen antippen. Punkte (501), Gewinn-Legs und wer beginnt wählen → <span class="k">Spiel starten</span>.<br>Bei <b>Turnier, Liga oder Blind-Doppel</b> erscheint euer Spiel von selbst – nur noch <span class="k">… beginnt</span> bzw. <span class="k">Spiel starten</span> antippen.') +
      st(2, 'Punkte eintragen', 'Nach jeder Aufnahme die <b>Summe der 3 Darts</b> eintippen und <span class="k">OK</span> – oder eine Schnelltaste wie <span class="k">60</span> <span class="k">100</span> <span class="k">140</span>. Kein Treffer: <span class="k">0</span>. Überworfen? Einfach die geworfenen Punkte eintragen – die App erkennt das.') +
      st(3, 'Auschecken', 'Den Rest eintippen und <span class="k">OK</span>. Die App fragt dann: <b>Mit welchem Dart?</b> → <span class="k">Ja – mit dem 2. Dart</span> usw. War es kein Doppel: <span class="k">Nein – überworfen</span>.') +
      st(4, 'Vertippt?', '<span class="k">↶ Rückgängig</span> nimmt die letzte Eingabe zurück – beliebig oft, auch nach Spielende.') +
      st(5, 'Spiel abbrechen', '<span class="k">Menü</span> → <span class="k">Spiel abbrechen</span>. Abgebrochene Spiele zählen nicht.') +
      st(6, 'Ansagen ein / aus', 'Der Lautsprecher <span class="k">🔊</span> oben rechts schaltet die Ansagen (Punkte, „Game shot“) ein oder aus.') +
      st(7, 'Training', 'Im Startbildschirm <span class="k">Training &amp; Bestenliste</span>: JDC Challenge, Around the Clock, Bob\'s 27, Checkout, Count Up, Cricket, Swedish Killer.') +
      '</div><div class="help"><b>Etwas geht nicht?</b>„Server nicht erreichbar“: Ist das Tablet im WLAN <b>TVR Dart</b>? Läuft das Chromebook? – Sonst bitte bei der Turnierleitung bzw. dem Spielleiter melden. Falsches Turnier- oder Ligaergebnis: kann dort korrigiert werden.</div></div>';
  }
  function st(no, h, p) { return '<div class="st"><div class="no">' + no + '</div><div><h2>' + h + '</h2><p>' + p + '</p></div></div>'; }
  function show() {
    var v = document.getElementById('sel').value, h = '';
    for (var i = 1; i <= 5; i++) if (v === 'all' || +v === i) h += page(i);
    document.getElementById('pages').innerHTML = h;
  }
  document.getElementById('sel').onchange = show;
  show();
})();
</script>
</body>
</html>
