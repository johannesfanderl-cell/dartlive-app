<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071d47">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Dart Live – Scheibe</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: #071d47; color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 1rem; overflow: hidden;
  -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button { font-family: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
input { font-family: inherit; }

#app { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
#top { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: .35rem .9rem; background: #0b2d6b; border-bottom: .15rem solid #fff; }
#top b { font-size: 1.25rem; letter-spacing: .08em; text-transform: uppercase; }
#top b span { color: #8cc4ff; }
#net { font-size: .85rem; color: #b7d3ff; }
#net.bad { color: #ffb3b3; font-weight: bold; }
#main { flex: 1 1 auto; position: relative; overflow: hidden; }

/* ---------- Einrichten ---------- */
.setup { height: 100%; overflow-y: auto; padding: .8rem 1rem 1rem; }
.setup h2 { font-size: 1.3rem; margin-bottom: .6rem; text-transform: uppercase; letter-spacing: .06em; }
.row { display: flex; align-items: center; margin-bottom: .55rem; }
.row label { flex: 0 0 9rem; font-size: 1rem; color: #b7d3ff; }
.row input { flex: 1 1 auto; font-size: 1.25rem; padding: .45rem .6rem; border-radius: .4rem; border: .15rem solid #3f6fbf; background: #fff; color: #071d47; -webkit-user-select: text; user-select: text; }
.row input.on { border-color: #8cc4ff; box-shadow: 0 0 0 .2rem rgba(140,196,255,.5); }
.chips { margin: 0 0 .7rem 9rem; }
.chips button { display: inline-block; margin: 0 .35rem .35rem 0; padding: .35rem .7rem; border-radius: 1rem; background: #10377f; border: .1rem solid #3f6fbf; font-size: .95rem; }
.seg { display: flex; flex: 1 1 auto; }
.seg button { flex: 1 1 0; padding: .55rem .3rem; font-size: 1.1rem; background: #10377f; border: .1rem solid #3f6fbf; margin-right: .3rem; border-radius: .4rem; }
.seg button.on { background: #fff; color: #071d47; font-weight: bold; border-color: #fff; }
.step { display: flex; align-items: center; }
.step button { width: 3rem; height: 2.6rem; font-size: 1.5rem; background: #10377f; border: .1rem solid #3f6fbf; border-radius: .4rem; }
.step span { min-width: 3rem; text-align: center; font-size: 1.5rem; font-weight: bold; }
.big { display: block; width: 100%; padding: .8rem; margin-top: .6rem; font-size: 1.5rem; font-weight: bold; letter-spacing: .08em; text-transform: uppercase; background: #fff; color: #071d47; border-radius: .5rem; }
.big.sec { background: #10377f; color: #fff; border: .12rem solid #3f6fbf; }
.hint { color: #ffb3b3; min-height: 1.3rem; font-size: 1rem; margin-top: .3rem; }

/* ---------- Spiel ---------- */
.play { height: 100%; display: flex; }
.side { flex: 1 1 50%; display: flex; flex-direction: column; padding: .6rem; }
.pad { flex: 1 1 50%; display: flex; flex-direction: column; padding: .6rem .6rem .6rem 0; }
.info { font-size: .95rem; color: #b7d3ff; text-align: center; margin-bottom: .4rem; }
.pl { flex: 1 1 0; display: flex; flex-direction: column; justify-content: center; border: .15rem solid #3f6fbf; border-radius: .6rem; padding: .4rem .8rem; margin-bottom: .5rem; background: #10377f; position: relative; }
.pl:last-child { margin-bottom: 0; }
.pl.on { background: #fff; color: #071d47; border-color: #fff; }
.pl .nm { font-size: 1.35rem; font-weight: bold; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 4.5rem; }
.pl .lg { position: absolute; top: .4rem; right: .8rem; font-size: 1.1rem; font-weight: bold; }
.pl .rm { font-size: 4.6rem; font-weight: bold; line-height: 1; }
.pl .st { font-size: .9rem; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .tw { font-size: .85rem; font-weight: bold; color: #0b2d6b; }
.disp { display: flex; align-items: center; justify-content: space-between; background: #fff; color: #071d47; border-radius: .5rem; padding: .2rem .8rem; margin-bottom: .45rem; min-height: 3.6rem; }
.disp .who { font-size: 1rem; font-weight: bold; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
.disp .val { font-size: 2.6rem; font-weight: bold; }
.disp .val.ph { font-size: 1.1rem; color: #7a8fb3; font-weight: normal; }
.quick { display: flex; flex-wrap: wrap; margin-bottom: .2rem; }
.quick button { flex: 1 1 18%; margin: 0 .25rem .25rem 0; padding: .45rem 0; font-size: 1.1rem; font-weight: bold; background: #10377f; border: .1rem solid #3f6fbf; border-radius: .35rem; }
.keys { flex: 1 1 auto; display: flex; flex-wrap: wrap; }
.keys button { flex: 0 0 32.3%; margin: 0 1% 1% 0; font-size: 2rem; font-weight: bold; background: #10377f; border: .1rem solid #3f6fbf; border-radius: .45rem; }
.keys button.ok { background: #fff; color: #071d47; border-color: #fff; font-size: 1.6rem; }
.keys button:active, .quick button:active, .acts button:active { background: #3f6fbf; }
.acts { display: flex; margin-top: .25rem; }
.acts button { flex: 1 1 0; margin-right: .3rem; padding: .55rem 0; font-size: 1.05rem; background: #0b2d6b; border: .1rem solid #3f6fbf; border-radius: .4rem; }
.acts button:last-child { margin-right: 0; }
.err { color: #ffb3b3; font-weight: bold; }

/* ---------- Ende ---------- */
.done { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1rem; }
.done h1 { font-size: 2.6rem; text-transform: uppercase; letter-spacing: .04em; }
.done .res { font-size: 4.4rem; font-weight: bold; margin: .3rem 0; }
.done p { color: #b7d3ff; font-size: 1.1rem; margin-bottom: .3rem; }
.done .btns { width: 70%; max-width: 30rem; }

/* ---------- Dialog / Meldung ---------- */
#dlg { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.65); z-index: 10; }
#dlg .box { position: absolute; top: 50%; left: 50%; width: 26rem; max-width: 92%; transform: translate(-50%,-50%); -webkit-transform: translate(-50%,-50%); background: #fff; color: #071d47; border-radius: .7rem; padding: 1.1rem; text-align: center; }
#dlg h3 { font-size: 1.5rem; margin-bottom: .4rem; }
#dlg p { font-size: 1.05rem; margin-bottom: .7rem; }
#dlg button { display: block; width: 100%; padding: .7rem; margin-top: .4rem; font-size: 1.2rem; font-weight: bold; border-radius: .45rem; background: #0b2d6b; color: #fff; }
#dlg button.sec { background: #e3ebf7; color: #071d47; }
#toast { display: none; position: absolute; left: 50%; bottom: 1rem; transform: translateX(-50%); -webkit-transform: translateX(-50%); background: #fff; color: #071d47; font-weight: bold; font-size: 1.2rem; padding: .6rem 1.2rem; border-radius: .5rem; z-index: 11; box-shadow: 0 .2rem 1rem rgba(0,0,0,.5); }

@media (orientation: portrait) {
  .play { flex-direction: column; }
  .side { flex: 0 0 auto; padding-bottom: 0; }
  .pl { flex: 0 0 auto; }
  .pad { padding: .6rem; }
  .row label { flex-basis: 7rem; }
  .chips { margin-left: 7rem; }
}
</style>
</head>
<body>
<div id="app">
  <div id="top"><b>Scheibe <span id="bn">?</span></b><span id="net">verbinde …</span></div>
  <div id="main"></div>
</div>
<div id="dlg"><div class="box" id="dlgbox"></div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var N = parseInt(location.pathname.replace(/[^0-9]/g, ''), 10);
  if (!(N >= 1 && N <= 5)) { N = parseInt((location.search.match(/s=(\d)/) || [])[1], 10) || 1; }
  document.getElementById('bn').innerHTML = N;
  document.title = 'Dart Live – Scheibe ' + N;

  var IMPOSSIBLE = { 163: 1, 166: 1, 169: 1, 172: 1, 173: 1, 175: 1, 176: 1, 178: 1, 179: 1 };
  var QUICK = [0, 26, 41, 45, 60, 81, 85, 100, 140, 180];

  var board = { status: 'idle' };
  var names = [];
  var undo = [];
  var typed = '';
  var msg = '';
  var setup = { n1: '', n2: '', start: 501, legs: 2, dout: true, first: 0, active: 0 };
  var dirty = false, saving = false, loaded = false;
  var tour = null, ver = 0, lastAssign = '';

  /* ---------- Hilfen ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function avg(p) { return p.visits ? (p.sum / p.visits).toFixed(1).replace('.', ',') : '–'; }
  function $(id) { return document.getElementById(id); }

  function xhr(method, url, body, cb) {
    // App ohne Server: Schreibzugriffe gehen direkt an die App
    if (window.DartLocal && method !== 'GET') {
      var t = null;
      try { t = window.DartLocal.call(method, url, body != null ? JSON.stringify(body) : ''); } catch (e) { t = null; }
      setTimeout(function () { var d = null; try { d = JSON.parse(t); } catch (e) { d = null; } cb(d && !d.error ? null : 'lokal', d); }, 0);
      return;
    }
    var r = new XMLHttpRequest();
    r.open(method, url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + new Date().getTime(), true);
    r.timeout = 8000;
    r.onreadystatechange = function () {
      if (r.readyState !== 4) return;
      var data = null;
      try { data = JSON.parse(r.responseText); } catch (e) { data = null; }
      cb(r.status >= 200 && r.status < 300 ? null : (r.status || 'Netz'), data);
    };
    if (body != null) { r.setRequestHeader('Content-Type', 'application/json'); r.send(JSON.stringify(body)); }
    else r.send();
  }

  function setNet(ok, text) { var n = $('net'); n.className = ok ? '' : 'bad'; n.innerHTML = esc(text); }

  function scale() {
    var w = window.innerWidth, h = window.innerHeight;
    var f = w > h ? Math.min(w / 62, h / 36) : Math.min(w / 36, h / 62);
    document.documentElement.style.fontSize = Math.max(9, Math.round(f * 10) / 10) + 'px';
  }

  var toastT = null;
  function toast(t) {
    var el = $('toast'); el.innerHTML = esc(t); el.style.display = 'block';
    clearTimeout(toastT); toastT = setTimeout(function () { el.style.display = 'none'; }, 2200);
  }

  var dlgBtns = [];
  function dialog(title, text, btns) {
    dlgBtns = btns;
    var h = '<h3>' + esc(title) + '</h3>' + (text ? '<p>' + esc(text) + '</p>' : '');
    for (var i = 0; i < btns.length; i++) h += '<button data-dlg="' + i + '"' + (btns[i].sec ? ' class="sec"' : '') + '>' + esc(btns[i].label) + '</button>';
    $('dlgbox').innerHTML = h;
    $('dlg').style.display = 'block';
  }
  function closeDlg() { $('dlg').style.display = 'none'; dlgBtns = []; }

  /* ---------- Speichern ---------- */
  function save() {
    dirty = true;
    if (saving) return;
    saving = true; dirty = false;
    var copy = clone(board);
    xhr('PUT', '/api/board/' + N, copy, function (err) {
      saving = false;
      if (err) { dirty = true; setNet(false, '⚠ nicht gespeichert – keine Verbindung'); return; }
      setNet(true, '● verbunden');
      if (dirty) save();
    });
  }
  setInterval(function () { if (dirty && !saving) save(); }, 3000);

  function load() {
    xhr('GET', '/api/state', null, function (err, data) {
      if (err || !data) { setNet(false, '⚠ Server nicht erreichbar'); if (!loaded) render(); setTimeout(load, 3000); return; }
      setNet(true, '● verbunden');
      names = data.names || [];
      tour = data.tournament || null; ver = data.v || 0; lastAssign = assignKey();
      if (!loaded) {
        loaded = true;
        var b = data.boards && data.boards[N];
        if (b && b.status === 'training' && b.g && !b.g.finished) { location.replace('/t' + N); return; }
        if (b && (b.status === 'play' || b.status === 'done')) board = b;
        if (b && (b.status === 'play' || b.status === 'done') && b.players && b.players.length === 2) { setup.n1 = b.players[0].name; setup.n2 = b.players[1].name; setup.start = b.start || 501; setup.legs = b.legsToWin || 2; setup.dout = b.doubleOut !== false; }
      }
      render();
      if (!watching) { watching = true; setTimeout(watch, 500); }
    });
  }

  /* ---------- Turnier ---------- */
  var watching = false;
  function myMatch() {
    if (!tour || !tour.matches) return null;
    for (var i = 0; i < tour.matches.length; i++) { var m = tour.matches[i]; if (m.status === 'assigned' && m.board === N && m.p1 && m.p2) return m; }
    return null;
  }
  function assignKey() { var m = myMatch(); return m ? m.id : ''; }
  function tLabel(m) { return m.phase === 'group' ? 'Gruppe ' + m.group + ' · Runde ' + m.round : m.label; }
  // Hält die Turnierdaten aktuell, damit neue Spielzuteilungen sofort erscheinen
  function watch() {
    var r = new XMLHttpRequest(), done = false;
    var guard = setTimeout(function () { if (!done) { done = true; try { r.abort(); } catch (e) {} setTimeout(watch, 2000); } }, 40000);
    r.onreadystatechange = function () {
      if (r.readyState !== 4 || done) return;
      done = true; clearTimeout(guard);
      var d = null; try { d = JSON.parse(r.responseText); } catch (e) { d = null; }
      if (!d) { setTimeout(watch, 3000); return; }
      ver = d.v; tour = d.tournament || null; names = d.names || names;
      var k = assignKey();
      if (k !== lastAssign) {
        lastAssign = k;
        var ae = document.activeElement;
        if (board.status !== 'play' && !(ae && ae.tagName === 'INPUT') && $('dlg').style.display !== 'block') render();
      }
      setTimeout(watch, 100);
    };
    if (window.DartLocal) return; // ohne Server gibt es kein Turnier
    r.open('GET', '/api/wait?v=' + ver + '&_=' + new Date().getTime(), true); r.send();
  }

  /* ---------- Spiellogik ---------- */
  function newPlayer(name, start) { return { name: name, legs: 0, rem: start, sum: 0, visits: 0, last: [] }; }

  function startMatch(n1, n2, start, legs, dout, first, tm) {
    board = {
      tmatch: tm ? tm.id : undefined, tlabel: tm ? tLabel(tm) : undefined,
      status: 'play', start: start, legsToWin: legs, doubleOut: dout,
      players: [newPlayer(n1, start), newPlayer(n2, start)],
      turn: first, legStarter: first, leg: 1, winner: null,
      banner: 'Game on!', bannerId: new Date().getTime()
    };
    undo = []; typed = ''; msg = '';
    save(); render();
  }

  function pushUndo() { undo.push(JSON.stringify(board)); if (undo.length > 60) undo.shift(); }

  function addLast(p, v) { p.last.push(v); if (p.last.length > 3) p.last.shift(); }

  function submit(score) {
    if (board.status !== 'play') return;
    if (isNaN(score) || score < 0 || score > 180 || IMPOSSIBLE[score]) { msg = score + ' ist nicht möglich'; typed = ''; render(); return; }
    var p = board.players[board.turn];
    var rest = p.rem - score;
    if (rest < 0 || (board.doubleOut && rest === 1)) { bust(score); return; }
    if (rest === 0) {
      if (board.doubleOut) {
        dialog('Checkout?', p.name + ' wirft ' + score + '. Mit einem Doppel beendet?', [
          { label: 'Ja, Leg gewonnen', fn: function () { checkout(score); } },
          { label: 'Nein – überworfen', sec: true, fn: function () { bust(score); } },
          { label: 'Abbrechen', sec: true, fn: function () { typed = ''; render(); } }
        ]);
        return;
      }
      checkout(score); return;
    }
    pushUndo();
    p.rem = rest; p.sum += score; p.visits++; addLast(p, score);
    board.turn = 1 - board.turn;
    typed = ''; msg = '';
    save(); render();
  }

  function bust(score) {
    pushUndo();
    var p = board.players[board.turn];
    p.visits++; addLast(p, 'Bust');
    board.turn = 1 - board.turn;
    typed = ''; msg = '';
    toast(p.name + ': überworfen (' + score + ')');
    save(); render();
  }

  function checkout(score) {
    pushUndo();
    var p = board.players[board.turn];
    var o = board.players[1 - board.turn];
    p.sum += score; p.visits++; addLast(p, score); p.rem = 0;
    p.legs++;
    typed = ''; msg = '';
    if (p.legs >= board.legsToWin) {
      board.status = 'done'; board.winner = board.turn;
      board.banner = p.name + ' gewinnt ' + p.legs + ':' + o.legs;
    } else {
      board.banner = 'Leg an ' + p.name + ' (' + score + ' Check)';
      board.leg++;
      board.legStarter = 1 - board.legStarter;
      board.turn = board.legStarter;
      p.rem = board.start; o.rem = board.start; p.last = []; o.last = [];
    }
    board.bannerId = new Date().getTime();
    save(); render();
  }

  function doUndo() {
    if (!undo.length) { toast('Nichts zum Rückgängigmachen'); return; }
    board = JSON.parse(undo.pop());
    typed = ''; msg = '';
    save(); render();
  }

  /* ---------- Darstellung ---------- */
  function render() {
    var m = $('main');
    if (!loaded) { m.innerHTML = '<div class="done"><p>Lade …</p></div>'; return; }
    if (board.status === 'play') m.innerHTML = playHTML();
    else if (board.status === 'done') m.innerHTML = doneHTML();
    else m.innerHTML = setupHTML();
  }

  function setupHTML() {
    var h = '<div class="setup">';
    var tm = myMatch();
    if (tm) {
      h += '<div style="background:#fff;color:#071d47;border-radius:.6rem;padding:.8rem 1rem;margin-bottom:1rem">' +
        '<div style="font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:#3f5f99">' + esc(tour.name) + ' · ' + esc(tLabel(tm)) + '</div>' +
        '<div style="font-size:2rem;font-weight:bold;margin:.2rem 0">' + esc(tm.p1) + ' – ' + esc(tm.p2) + '</div>' +
        '<div style="font-size:1rem;margin-bottom:.4rem">' + tour.cfg.start + (tour.cfg.doubleOut ? ' Double Out' : '') + ' · First to ' + tm.legsToWin + ' Legs · Ausbullen: Wer beginnt?</div>' +
        '<div class="seg"><button data-tstart="0" style="background:#0b2d6b;color:#fff;font-weight:bold">' + esc(tm.p1) + ' beginnt</button>' +
        '<button data-tstart="1" style="background:#0b2d6b;color:#fff;font-weight:bold">' + esc(tm.p2) + ' beginnt</button></div></div>';
    } else if (tour && (tour.status === 'groups' || tour.status === 'ko')) {
      h += '<p style="color:#b7d3ff;margin-bottom:.6rem">' + esc(tour.name) + ': Für diese Scheibe ist gerade kein Turnierspiel eingeteilt. Es erscheint hier automatisch.</p>';
    }
    h += '<h2>' + (tm ? 'Oder freies Spiel' : 'Neues Spiel') + '</h2>';
    h += '<div class="row"><label>Spieler 1</label><input id="n1" maxlength="24" autocomplete="off" placeholder="Name" value="' + esc(setup.n1) + '"' + (setup.active === 0 ? ' class="on"' : '') + '></div>';
    h += '<div class="row"><label>Spieler 2</label><input id="n2" maxlength="24" autocomplete="off" placeholder="Name" value="' + esc(setup.n2) + '"' + (setup.active === 1 ? ' class="on"' : '') + '></div>';
    if (names.length) {
      h += '<div class="chips">';
      for (var i = 0; i < names.length && i < 24; i++) h += '<button data-name="' + esc(names[i]) + '">' + esc(names[i]) + '</button>';
      h += '</div>';
    }
    h += '<div class="row"><label>Punkte</label><div class="seg">' +
      '<button data-start="301"' + (setup.start === 301 ? ' class="on"' : '') + '>301</button>' +
      '<button data-start="501"' + (setup.start === 501 ? ' class="on"' : '') + '>501</button>' +
      '<button data-start="701"' + (setup.start === 701 ? ' class="on"' : '') + '>701</button></div></div>';
    h += '<div class="row"><label>Gewinn-Legs</label><div class="step"><button data-legs="-1">−</button><span>' + setup.legs + '</span><button data-legs="1">+</button></div>' +
      '<span style="margin-left:.8rem;color:#b7d3ff">(First to ' + setup.legs + ')</span></div>';
    h += '<div class="row"><label>Double Out</label><div class="seg">' +
      '<button data-dout="1"' + (setup.dout ? ' class="on"' : '') + '>Ja</button>' +
      '<button data-dout="0"' + (!setup.dout ? ' class="on"' : '') + '>Nein</button></div></div>';
    h += '<div class="row"><label>Beginnt</label><div class="seg">' +
      '<button data-first="0"' + (setup.first === 0 ? ' class="on"' : '') + '>' + esc(setup.n1 || 'Spieler 1') + '</button>' +
      '<button data-first="1"' + (setup.first === 1 ? ' class="on"' : '') + '>' + esc(setup.n2 || 'Spieler 2') + '</button></div></div>';
    h += '<div class="hint">' + esc(msg) + '</div>';
    h += '<button class="big" data-a="start">Spiel starten</button>';
    h += '<button class="big sec" data-a="training">Training &amp; Bestenliste</button></div>';
    return h;
  }

  function plHTML(i) {
    var p = board.players[i], on = board.turn === i;
    return '<div class="pl' + (on ? ' on' : '') + '">' +
      '<div class="nm">' + esc(p.name) + '</div>' +
      '<div class="lg">Legs ' + p.legs + '</div>' +
      '<div class="rm">' + p.rem + '</div>' +
      '<div class="st">Ø ' + avg(p) + (p.last.length ? ' · Letzte: ' + esc(p.last.join(', ')) : '') + '</div>' +
      (on ? '<div class="tw">▶ ist dran</div>' : '') +
      '</div>';
  }

  function playHTML() {
    var p = board.players[board.turn];
    var h = '<div class="play"><div class="side">';
    h += '<div class="info">' + (board.tlabel ? esc(board.tlabel) + ' · ' : '') + 'Leg ' + board.leg + ' · First to ' + board.legsToWin + ' · ' + board.start + (board.doubleOut ? ' Double Out' : ' Single Out') + '</div>';
    h += plHTML(0) + plHTML(1) + '</div><div class="pad">';
    h += '<div class="disp"><span class="who">' + esc(p.name) + '</span>' +
      (typed ? '<span class="val">' + esc(typed) + '</span>' : '<span class="val ph' + (msg ? ' err' : '') + '">' + esc(msg || 'Punkte der Aufnahme') + '</span>') + '</div>';
    h += '<div class="quick">';
    for (var i = 0; i < QUICK.length; i++) h += '<button data-q="' + QUICK[i] + '">' + QUICK[i] + '</button>';
    h += '</div><div class="keys">';
    var k = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'];
    for (var j = 0; j < k.length; j++) {
      if (k[j] === 'del') h += '<button data-k="del">⌫</button>';
      else if (k[j] === 'ok') h += '<button data-k="ok" class="ok">OK</button>';
      else h += '<button data-k="' + k[j] + '">' + k[j] + '</button>';
    }
    h += '</div><div class="acts"><button data-a="undo">↶ Rückgängig</button><button data-a="menu">Menü</button></div>';
    h += '</div></div>';
    return h;
  }

  function doneHTML() {
    var w = board.players[board.winner], l = board.players[1 - board.winner];
    var h = '<div class="done"><p>Spiel beendet</p><h1>' + esc(w.name) + ' gewinnt</h1>';
    h += '<div class="res">' + w.legs + ' : ' + l.legs + '</div>';
    h += '<p>Ø ' + esc(w.name) + ' ' + avg(w) + ' · Ø ' + esc(l.name) + ' ' + avg(l) + '</p>';
    if (board.tmatch) {
      var nx = myMatch();
      h += '<p style="color:#fff;font-weight:bold">✓ Ergebnis an die Turnierleitung gemeldet</p>';
      h += '<div class="btns">' + (nx ? '<button class="big" data-a="new">Nächstes Spiel: ' + esc(nx.p1) + ' – ' + esc(nx.p2) + '</button>' : '<button class="big" data-a="new">Fertig – Scheibe frei</button>') +
        '<button class="big sec" data-a="undo">↶ Letzten Wurf zurücknehmen</button></div></div>';
      return h;
    }
    h += '<div class="btns"><button class="big" data-a="rematch">Rückspiel</button>' +
      '<button class="big sec" data-a="new">Neues Spiel</button>' +
      '<button class="big sec" data-a="undo">↶ Letzten Wurf zurücknehmen</button>' +
      '<button class="big sec" data-a="free">Scheibe freigeben</button></div></div>';
    return h;
  }

  /* ---------- Bedienung ---------- */
  function onTap(e) {
    var t = e.target;
    while (t && t !== document.body && !(t.getAttribute && (t.getAttribute('data-k') || t.getAttribute('data-q') || t.getAttribute('data-a') || t.getAttribute('data-dlg') ||
      t.getAttribute('data-name') || t.getAttribute('data-tstart') || t.getAttribute('data-start') || t.getAttribute('data-legs') || t.getAttribute('data-dout') || t.getAttribute('data-first')))) t = t.parentNode;
    if (!t || t === document.body || !t.getAttribute) return;
    var a;

    if ((a = t.getAttribute('data-tstart')) !== null) {
      var tm = myMatch();
      if (tm) startMatch(tm.p1, tm.p2, tour.cfg.start, tm.legsToWin, tour.cfg.doubleOut !== false, +a, tm);
      return;
    }
    if ((a = t.getAttribute('data-dlg')) !== null) { var b = dlgBtns[+a]; closeDlg(); if (b && b.fn) b.fn(); return; }

    if ((a = t.getAttribute('data-k')) !== null) {
      if (a === 'del') typed = typed.slice(0, -1);
      else if (a === 'ok') { if (typed === '') { msg = 'Erst Punkte eingeben'; render(); return; } submit(parseInt(typed, 10)); return; }
      else if (typed.length < 3) typed = (typed === '0' ? '' : typed) + a;
      msg = ''; render(); return;
    }
    if ((a = t.getAttribute('data-q')) !== null) { typed = ''; submit(parseInt(a, 10)); return; }

    if ((a = t.getAttribute('data-name')) !== null) {
      readNames();
      if (setup.active === 0) { setup.n1 = a; if (!setup.n2) setup.active = 1; }
      else { setup.n2 = a; if (!setup.n1) setup.active = 0; }
      msg = ''; render(); return;
    }
    if ((a = t.getAttribute('data-start')) !== null) { readNames(); setup.start = +a; render(); return; }
    if ((a = t.getAttribute('data-legs')) !== null) { readNames(); setup.legs = Math.max(1, Math.min(9, setup.legs + (+a))); render(); return; }
    if ((a = t.getAttribute('data-dout')) !== null) { readNames(); setup.dout = a === '1'; render(); return; }
    if ((a = t.getAttribute('data-first')) !== null) { readNames(); setup.first = +a; render(); return; }

    a = t.getAttribute('data-a');
    if (a === 'start') {
      readNames();
      var n1 = setup.n1.replace(/^\s+|\s+$/g, ''), n2 = setup.n2.replace(/^\s+|\s+$/g, '');
      if (!n1 || !n2) { msg = 'Bitte beide Namen eingeben'; render(); return; }
      if (n1.toLowerCase() === n2.toLowerCase()) { msg = 'Die Namen müssen verschieden sein'; render(); return; }
      startMatch(n1, n2, setup.start, setup.legs, setup.dout, setup.first);
    } else if (a === 'undo') doUndo();
    else if (a === 'menu') {
      dialog('Menü', board.players[0].name + ' gegen ' + board.players[1].name, [
        { label: 'Spiel abbrechen', fn: function () {
          dialog('Wirklich abbrechen?', 'Das laufende Spiel wird beendet und nicht gewertet.', [
            { label: 'Ja, abbrechen', fn: function () { board = { status: 'idle', tmatch: board.tmatch }; undo = []; save(); render(); } },
            { label: 'Nein, weiterspielen', sec: true }
          ]);
        } },
        { label: 'Weiterspielen', sec: true }
      ]);
    } else if (a === 'rematch') {
      var p = board.players;
      startMatch(p[1].name, p[0].name, board.start, board.legsToWin, board.doubleOut, 0);
    } else if (a === 'new') { board = { status: 'idle' }; undo = []; msg = ''; save(); render(); }
    else if (a === 'training') { location.href = '/t' + N; }
    else if (a === 'free') { setup.n1 = ''; setup.n2 = ''; board = { status: 'idle' }; undo = []; msg = ''; save(); render(); }
  }

  function readNames() {
    var a = $('n1'), b = $('n2');
    if (a) setup.n1 = a.value; if (b) setup.n2 = b.value;
  }

  document.addEventListener('click', onTap, false);
  document.addEventListener('focusin', function (e) {
    if (e.target.id === 'n1' || e.target.id === 'n2') {
      setup.active = e.target.id === 'n1' ? 0 : 1;
      $('n1').className = setup.active === 0 ? 'on' : ''; $('n2').className = setup.active === 1 ? 'on' : '';
    }
  }, false);
  document.addEventListener('input', function (e) { if (e.target.id === 'n1') setup.n1 = e.target.value; if (e.target.id === 'n2') setup.n2 = e.target.value; }, false);
  document.addEventListener('keydown', function (e) {
    if (board.status !== 'play' || $('dlg').style.display === 'block') return;
    var k = e.key || '';
    if (/^[0-9]$/.test(k) && typed.length < 3) { typed = (typed === '0' ? '' : typed) + k; msg = ''; render(); }
    else if (k === 'Backspace') { typed = typed.slice(0, -1); render(); }
    else if (k === 'Enter' && typed) submit(parseInt(typed, 10));
  }, false);
  window.addEventListener('resize', scale, false);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && dirty) save(); }, false);

  scale();
  render();
  load();
})();
</script>
</body>
</html>
