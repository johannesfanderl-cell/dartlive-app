<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script src="/local.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dart Live – Anzeige</title>
<style>
/* Absichtlich sehr einfaches CSS (Tabellen, keine Variablen, kein Grid/Flex),
   damit auch alte Fernseh-Browser alles richtig anzeigen. */
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1120; }
body { color: #ffffff; font-family: "Roboto", "Segoe UI", system-ui, -apple-system, Arial, sans-serif; font-size: 20px; cursor: none; }
#bar { height: 1.7em; line-height: 1.7em; padding: 0 0.8em; background: #131c31; border-bottom: 1px solid #26324f; font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
#bar .r { float: right; }
#bar .net { color: #ff8f8f; margin-right: 1em; }
table.grid { width: 100%; border-collapse: separate; border-spacing: 0.4em; table-layout: fixed; }
table.grid td { vertical-align: top; }
.pn { position: relative; background: #131c31; border: 0.08em solid #2e3d61; border-radius: 0.6em; overflow: hidden; }
.hd { height: 2.7em; padding: 0.25em 0.6em 0 0.6em; background: #1c2741; white-space: nowrap; overflow: hidden; }
.hd b { display: block; font-size: 1.15em; line-height: 1.25em; letter-spacing: 0.08em; text-transform: uppercase; }
.hd span { display: block; color: #9fb0cf; font-size: 0.85em; line-height: 1.3em; }
.pb { display: table; width: 100%; border-top: 0.1em solid #2e3d61; }
.pbi { display: table-cell; vertical-align: middle; padding: 0 0.6em; }
.pb.on { background: #2f6fed; color: #ffffff; }
.nm { font-size: 1.35em; font-weight: bold; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
.nm i { font-style: normal; float: right; margin-left: 0.4em; }
.rm { font-size: 5.2em; font-weight: bold; line-height: 1; }
.st { font-size: 0.95em; white-space: nowrap; overflow: hidden; opacity: 0.85; }
.idle { display: table; width: 100%; text-align: center; }
.idle.spon { display: block; overflow: hidden; }
.idle div { display: table-cell; vertical-align: middle; }
.idle b { display: block; font-size: 2em; letter-spacing: 0.06em; text-transform: uppercase; }
.idle span { display: block; font-size: 1.2em; color: #9fb0cf; margin-top: 0.3em; }
.win { display: table; width: 100%; text-align: center; background: #2f6fed; color: #ffffff; }
.win div { display: table-cell; vertical-align: middle; padding: 0 0.4em; }
.win small { display: block; font-size: 1.1em; letter-spacing: 0.1em; text-transform: uppercase; }
.win b { display: block; font-size: 2.2em; text-transform: uppercase; margin: 0.2em 0; word-wrap: break-word; }
.win em { display: block; font-style: normal; font-size: 3.6em; font-weight: bold; }
table.duo { width: 100%; border-collapse: collapse; table-layout: fixed; border-top: 0.1em solid #2e3d61; }
table.duo td { vertical-align: middle; text-align: center; padding: 0 0.5em; }
table.duo td.l { border-right: 0.1em solid #2e3d61; }
table.duo td.on { background: #2f6fed; color: #ffffff; }
table.duo .nm { font-size: 2em; }
table.duo .nm i { float: none; display: block; font-size: 0.8em; margin: 0.15em 0 0 0; }
table.duo .rm { font-size: 8.5em; }
table.duo .st { font-size: 1.4em; }
body.single .hd { height: 3.7em; }
body.single .hd b { font-size: 1.5em; }
body.single .hd span { font-size: 1.1em; }
.tr .nm { line-height: 1.6; }
.tr .nm i { font-size: 2.3em; line-height: 0.7; }
.many .tr .nm { font-size: 1.1em; }
.many .tr .nm i { font-size: 1.9em; }
.lots .tr .nm { font-size: 0.95em; }
.lots .tr .st { font-size: 0.75em; }
body.single .tr .nm { font-size: 1.9em; }
body.single .tr .st { font-size: 1.2em; }
.st.cur { font-weight: bold; opacity: 1; }
.intro td { background: #1c2741; }
.intro .nm { font-size: 1.7em; margin-bottom: 0.3em; }
.intro .st { font-size: 1.05em; opacity: 1; line-height: 1.5; }
body.single .intro .nm { font-size: 3em; }
body.single .intro .st { font-size: 1.6em; }
.ban { position: absolute; left: 0; right: 0; top: 40%; padding: 0.6em 0.4em; background: #2f6fed; color: #ffffff; text-align: center; font-size: 1.5em; font-weight: bold; text-transform: uppercase; border-top: 0.15em solid #2e3d61; border-bottom: 0.15em solid #2e3d61; }

/* ---------- Modernes Design (gemeinsam) ---------- */
body { background-image: radial-gradient(ellipse 90% 55% at 50% -12%, #1b2b57 0%, rgba(11,17,32,0) 70%); background-repeat: no-repeat; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="bar"><span class="r"><span class="net" id="net"></span><span id="clock"></span></span>TV Riedenburg · Dart Live</div>
<div id="wrap"></div>
<div id="spbar" style="position:absolute;left:0;right:0;bottom:0;display:none;overflow:hidden;border-top:0.12em solid #2e3d61"></div>
<script src="/sponsor.js"></script>

<script>
(function () {
  var path = location.pathname;
  var list = [1, 2, 3];
  if (/tv2/.test(path)) list = [4, 5];
  else if (/tv3/.test(path) || /\/tv$/.test(path) || /\/tv\/$/.test(path)) list = [1, 2, 3, 4, 5];
  var single = false;
  var mm = path.match(/\/m([1-5])\/?$/);
  if (mm) { list = [parseInt(mm[1], 10)]; single = true; document.body.className = 'single'; }
  var qm = location.search.match(/s=([1-5]+)/);
  if (qm) { list = []; for (var q = 0; q < qm[1].length; q++) list.push(parseInt(qm[1].charAt(q), 10)); }

  var state = null, version = 0, seenBanner = {}, bannerUntil = {}, first = true;
  var seenMid = {}, intro = {}, stats = null;

  /* Einlauf: Vor Turnier-, Liga- und Vereinsliga-Spielen erscheinen beide Spieler mit ihrer Statistik */
  function loadStats() {
    var r = new XMLHttpRequest();
    r.onreadystatechange = function () {
      if (r.readyState !== 4) return;
      var d = null; try { d = JSON.parse(r.responseText); } catch (e) { d = null; }
      if (!d) return;
      var S = {}, ms = d.matches || [];
      for (var i = 0; i < ms.length; i++) {
        if (ms[i].doubles) continue;
        for (var k = 0; k < 2; k++) {
          var p = ms[i].players[k], key = p.name.toLowerCase();
          var s = S[key] || (S[key] = { games: 0, wins: 0, sum: 0, darts: 0, hf: 0, c180: 0 });
          s.games++; if (ms[i].winner === k) s.wins++;
          s.sum += p.sum; s.darts += p.darts || p.visits * 3; s.c180 += p.c180 || 0; if (p.hf > s.hf) s.hf = p.hf;
        }
      }
      stats = S; render();
    };
    r.open('GET', '/api/matches?_=' + new Date().getTime(), true); r.send();
  }
  function introBlock(n, b) {
    var h = '<table class="duo intro"><tr>';
    for (var i = 0; i < 2; i++) {
      var p = b.players[i], s = stats && stats[p.name.toLowerCase()];
      h += '<td class="' + (i === 0 ? 'l' : 'r') + '"><div class="nm">' + esc(p.name) + '</div>' +
        (s ? '<div class="st">&Oslash; ' + (s.darts ? (s.sum / s.darts * 3).toFixed(1).replace('.', ',') : '–') + '</div><div class="st">' + s.games + ' Spiele &middot; ' + s.wins + ' Siege</div>' +
          '<div class="st">High Finish ' + (s.hf || '–') + (s.c180 ? ' &middot; ' + s.c180 + '&times; 180' : '') + '</div>' : '<div class="st">' + (stats ? 'erstes Spiel' : '&nbsp;') + '</div>') + '</td>';
    }
    return h + '</tr></table>';
  }
  var base = 20;

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function avg(p) { return p.visits ? (p.sum / p.visits).toFixed(1).replace('.', ',') : '–'; }
  function el(id) { return document.getElementById(id); }

  function sizes() {
    var w = window.innerWidth || document.documentElement.clientWidth;
    var h = window.innerHeight || document.documentElement.clientHeight;
    base = single ? Math.floor(Math.min(w / 34, h / 24)) : Math.floor(Math.min(w / list.length / 15.5, h / 26));
    if (base < 8) base = 8;
    document.body.style.fontSize = base + 'px';
    return { w: w, h: h };
  }

  function panel(n) {
    var b = (state && state.boards && state.boards[n]) || { status: 'idle' };
    var h = '<div class="pn" id="pn' + n + '">';
    var info = '';
    if (b.status === 'play') info = 'Leg ' + b.leg + ' · FT' + b.legsToWin + ' · ' + b.start + (b.doubleOut ? ' DO' : '');
    var showIntro = b.status === 'play' && b.players && intro[n] && intro[n] > new Date().getTime();
    if (showIntro) info = (b.tlabel || 'Spiel') + ' · First to ' + b.legsToWin;
    h += '<div class="hd"><b>Scheibe ' + n + '</b><span>' + (esc(info) || '&nbsp;') + '</span></div>';
    if (showIntro) {
      h += introBlock(n, b);
    } else if (b.status === 'training' && b.view) {
      var vw = b.view, rows = vw.rows || [];
      h = '<div class="pn' + (rows.length > 2 ? ' many' : '') + (rows.length > 4 ? ' lots' : '') + '" id="pn' + n + '">';
      h += single ? '<div class="hd"><b>' + esc(vw.title) + '</b><span>' + esc(vw.sub || '') + '</span></div>'
                  : '<div class="hd"><b>Scheibe ' + n + '</b><span>' + esc(vw.title) + ' · ' + esc(vw.sub || '') + '</span></div>';
      for (var t = 0; t < rows.length; t++) {
        var rw = rows[t];
        h += '<div class="pb tr' + (rw.on ? ' on' : '') + '"><div class="pbi">' +
          '<div class="nm"><i>' + esc(rw.big) + '</i>' + (rw.on ? '&#9654; ' : '') + esc(rw.name) + '</div>' +
          '<div class="st">' + esc(rw.small) + '</div>' +
          (rw.on && vw.cur ? '<div class="st cur">' + esc(vw.cur) + '</div>' : '') +
          '</div></div>';
      }
    } else if (b.status === 'play' && b.players && single) {
      h += '<table class="duo"><tr>';
      for (var d = 0; d < 2; d++) {
        var q = b.players[d];
        h += '<td class="' + (d === 0 ? 'l' : 'r') + (b.turn === d ? ' on' : '') + '">' +
          '<div class="nm">' + (b.turn === d ? '&#9654; ' : '') + esc(q.name) + '<i>Legs ' + q.legs + '</i></div>' +
          '<div class="rm">' + q.rem + '</div>' +
          '<div class="st">&Oslash; ' + avg(q) + (q.last && q.last.length ? ' &nbsp;·&nbsp; ' + esc(q.last.join('  ')) : '') + '</div></td>';
      }
      h += '</tr></table>';
    } else if (b.status === 'play' && b.players) {
      for (var i = 0; i < 2; i++) {
        var p = b.players[i];
        h += '<div class="pb' + (b.turn === i ? ' on' : '') + '"><div class="pbi">' +
          '<div class="nm"><i>' + p.legs + '</i>' + (b.turn === i ? '&#9654; ' : '') + esc(p.name) + '</div>' +
          '<div class="rm">' + p.rem + '</div>' +
          '<div class="st">&Oslash; ' + avg(p) + (p.last && p.last.length ? ' &nbsp;·&nbsp; ' + esc(p.last.join('  ')) : '') + '</div>' +
          '</div></div>';
      }
    } else if (b.status === 'done' && b.players) {
      var w = b.players[b.winner], l = b.players[1 - b.winner];
      h += '<div class="win"><div><small>Sieger</small><b>' + esc(w.name) + '</b><em>' + w.legs + ' : ' + l.legs + '</em>' +
        '<small>gegen ' + esc(l.name) + '</small></div></div>';
    } else {
      var spIt = window.Sponsor && Sponsor.data && Sponsor.data.idle ? Sponsor.current(n) : null;
      if (spIt) h += '<div class="idle spon">' + Sponsor.slide(spIt, 'Scheibe frei') + '</div>';
      else h += '<div class="idle"><div><b>Scheibe ' + n + '</b><span>frei</span></div></div>';
    }
    if (!showIntro && b.banner && bannerUntil[n] && bannerUntil[n] > new Date().getTime()) h += '<div class="ban">' + esc(b.banner) + '</div>';
    h += '</div>';
    return h;
  }

  function render() {
    var s = sizes();
    var h = '<table class="grid"><tr>';
    for (var i = 0; i < list.length; i++) h += '<td>' + panel(list[i]) + '</td>';
    h += '</tr></table>';
    el('wrap').innerHTML = h;
    // Höhen in Pixeln setzen (zuverlässiger als CSS-Höhen in alten Browsern)
    var spb = el('spbar'), barH = 0;
    if (window.Sponsor && Sponsor.barOn()) { barH = Math.round(base * 2.2); spb.style.height = barH + 'px'; spb.style.fontSize = base + 'px'; spb.innerHTML = Sponsor.bar(); spb.style.display = 'block'; }
    else spb.style.display = 'none';
    var avail = s.h - el('bar').offsetHeight - barH - Math.round(base * 0.8) - 4;
    for (var j = 0; j < list.length; j++) {
      var pn = el('pn' + list[j]);
      if (!pn) continue;
      pn.style.height = avail + 'px';
      var hd = pn.firstChild.offsetHeight;
      var rest = avail - hd - 4;
      var kids = pn.childNodes, npb = 0;
      for (var q = 0; q < kids.length; q++) if (/^pb/.test(kids[q].className)) npb++;
      if (!npb) npb = 2;
      for (var k = 0; k < kids.length; k++) {
        var c = kids[k].className;
        if (/^pb/.test(c)) kids[k].style.height = Math.floor(rest / npb) + 'px';
        else if (/^idle/.test(c) || c === 'win' || /duo/.test(c)) kids[k].style.height = rest + 'px';
      }
    }
  }

  function apply(data) {
    var nowI = new Date().getTime();
    for (var x = 0; x < list.length; x++) {
      var nn = list[x], bb = data.boards && data.boards[nn];
      if (bb && bb.status === 'play' && bb.mid && seenMid[nn] !== bb.mid) {
        if (!first && (bb.tmatch || bb.vliga || bb.league) && bb.leg === 1 && bb.players && !bb.players[0].visits && !bb.players[1].visits) { intro[nn] = nowI + 9000; loadStats(); }
        seenMid[nn] = bb.mid;
      }
      if (bb && bb.status === 'play' && bb.players && (bb.players[0].visits || bb.players[1].visits)) intro[nn] = 0;
    }
    if (!data || !data.boards) return;
    var now = new Date().getTime();
    for (var i = 0; i < list.length; i++) {
      var n = list[i], b = data.boards[n];
      if (b && b.bannerId && seenBanner[n] !== b.bannerId) {
        if (!first) bannerUntil[n] = now + 6000;
        seenBanner[n] = b.bannerId;
      }
    }
    first = false;
    state = data; version = data.v;
    if (window.Sponsor) Sponsor.update(data.sponsorsRev || 0);
    render();
  }

  function setNet(t) { el('net').innerHTML = t; }

  function poll() {
    var r = new XMLHttpRequest(), done = false;
    var guard = setTimeout(function () { if (!done) { done = true; try { r.abort(); } catch (e) {} setNet('Verbindung wird gesucht …'); setTimeout(poll, 2000); } }, 40000);
    r.onreadystatechange = function () {
      if (r.readyState !== 4 || done) return;
      done = true; clearTimeout(guard);
      if (r.status === 200) {
        var d = null;
        try { d = JSON.parse(r.responseText); } catch (e) { d = null; }
        if (d) { setNet(''); apply(d); setTimeout(poll, 50); return; }
      }
      setNet('Verbindung wird gesucht …');
      setTimeout(poll, 2000);
    };
    try {
      r.open('GET', '/api/wait?v=' + version + '&_=' + new Date().getTime(), true);
      r.send();
    } catch (e) { done = true; clearTimeout(guard); setTimeout(poll, 3000); }
  }

  function clock() {
    var d = new Date(), m = d.getMinutes();
    el('clock').innerHTML = d.getHours() + ':' + (m < 10 ? '0' : '') + m;
  }

  // Banner nach Ablauf ausblenden
  setInterval(function () {
    var now = new Date().getTime(), redraw = false;
    for (var n in bannerUntil) if (bannerUntil[n] && bannerUntil[n] <= now) { bannerUntil[n] = 0; redraw = true; }
    for (var n2 in intro) if (intro[n2] && intro[n2] <= now) { intro[n2] = 0; redraw = true; }
    if (redraw) render();
  }, 1000);
  setInterval(clock, 15000);
  window.onresize = render;
  if (window.Sponsor) Sponsor.onChange = render;

  clock();
  render();
  poll();
})();
</script>
</body>
</html>
