name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: gradle :app:assembleLiveRelease :app:assembleTrainingRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: |
          cp app/build/outputs/apk/live/release/app-live-release.apk DartLive.apk
          cp app/build/outputs/apk/training/release/app-training-release.apk DartTraining.apk

      - name: Als Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Dart Live & Dart Training
          body: |
            Neueste Versionen der Apps für die Tablets.
            DartLive.apk – Spielbetrieb (Eingabe am Tablet, Spielstand am HDMI-Monitor)
            DartTraining.apk – Trainingsmodus mit Bestenliste
          files: |
            DartLive.apk
            DartTraining.apk
          make_latest: true
